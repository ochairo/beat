name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Beat validation
        run: pnpm validate

      - name: Run create-beat scaffold tests
        run: pnpm exec vitest run tests/create-beat.test.ts

      - name: Verify create-beat package can be packed
        working-directory: create-beat
        run: npm pack --dry-run
